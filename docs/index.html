<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>地震発生時ダッシュボード</title>
        <!-- PWA Manifest -->
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#ff6b35">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <meta name="apple-mobile-web-app-title" content="地震Chk">
        <link rel="apple-touch-icon" href="icon-192.png">
        <style>
            body,
            html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                font-family: sans-serif;
                background-color: #f0f0f0;
            }
            .grid-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                width: 100vw;
                height: 100vh;
                gap: 10px;
                padding: 10px;
                box-sizing: border-box;
            }
            .grid-item {
                background-color: #fff;
                border: 1px solid #ccc;
                border-radius: 8px;
                padding: 20px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .grid-item h2 {
                margin-top: 0;
                border-bottom: 2px solid #eee;
                padding-bottom: 10px;
            }
            iframe {
                width: 100%;
                height: 100%;
                border: none;
            }
            .offline-notice {
                background-color: #fff3cd;
                color: #856404;
                padding: 10px;
                text-align: center;
                display: none;
            }
            .offline-notice.show {
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="offline-notice" id="offlineNotice">
            📴 オフライン mode - 一部機能が制限されます
        </div>
        <div class="grid-container">
            <div class="grid-item" id="quadrant1">
                <h2>地震情報</h2>
                <iframe
                    src="https://earthquake.tenki.jp/bousai/earthquake/"
                ></iframe>
            </div>
            <div class="grid-item" id="quadrant2">
                <h2>インターネット接続診断</h2>
                <iframe src="icchecker.html"></iframe>
            </div>
            <div class="grid-item" id="quadrant3">
                <h2>スマホの通信状態情報</h2>
                <iframe src="iphone_checker.html"></iframe>
            </div>
            <div class="grid-item" id="quadrant4">
                <h2>停電情報</h2>
                <iframe src="https://teiden-info.hepco.co.jp"></iframe>
            </div>
        </div>
        
        <script>
            // Service Worker 登録
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('service-worker.js')
                        .then(reg => console.log('SW registered:', reg.scope))
                        .catch(err => console.log('SW registration failed:', err));
                });
            }
            
            // オフライン検出
            function updateOnlineStatus() {
                const notice = document.getElementById('offlineNotice');
                if (!navigator.onLine) {
                    notice.classList.add('show');
                } else {
                    notice.classList.remove('show');
                }
            }
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
            updateOnlineStatus();
        </script>
    </body>
</html>
